<html lang="fr">
<head>

<title>FieldNaturalistTrainer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Concept : carnet de terrain lisible en plein soleil. Fond lichen, encre vert très sombre, un seul accent mousse. */
:root{
  --bg:#eef1ea;--surface:#f9fbf6;--ink:#16241d;--muted:#5b6b62;--line:#d3dbcf;
  --accent:#2e6b4d;--accent-ink:#ffffff;--accent-soft:#dbe8df;
  --ok:#2e7d4f;--ok-soft:#dcefe2;--bad:#b3412f;--bad-soft:#f6e0da;--gold:#b9831a;--chip:#e2e8dc;
  --font-d:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --font-b:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1815;--surface:#17231e;--ink:#e3ece5;--muted:#95a89c;--line:#2a3a33;
  --accent:#6fcf9f;--accent-ink:#0b1a13;--accent-soft:#1d3329;
  --ok:#6fcf9f;--ok-soft:#173226;--bad:#ef8a74;--bad-soft:#3a1f1a;--gold:#e5b44a;--chip:#1f2d26;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding-block:16px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.hint{color:var(--muted);font-size:.9rem}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.sci{font-style:italic}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.plain{border:0;background:transparent;padding:0}
.btn{font:inherit;font-weight:700;border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btn.danger{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=password],select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
label.f small{font-weight:400;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.82rem;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar .thr{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs>div{display:flex;max-width:760px;width:100%;gap:2px}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;cursor:pointer;min-height:48px}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft);font-weight:700}
nav.tabs svg{width:22px;height:22px}
#map{height:300px;border-radius:12px;border:1px solid var(--line);background:var(--chip)}
.media{display:flex;flex-direction:column;gap:8px}
.media img.photo{width:100%;max-height:52vh;min-height:220px;object-fit:contain;background:#0b120f;border-radius:12px;display:block}
.attr{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.attr a{color:inherit}
.spec{position:relative;height:170px;border-radius:12px;overflow:hidden;background:#0b1020}
.spec canvas,.spec img{position:absolute;inset:0;width:100%;height:100%}
.spec .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.85;left:0}
.spec .ax{position:absolute;left:4px;font:11px var(--font-m);color:#fff;opacity:.8;text-shadow:0 0 3px #000}
.spec .nospec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c8d3cc;font-size:.85rem;padding:12px;text-align:center}
.namebox{text-align:center;display:flex;flex-direction:column;gap:2px;padding:6px 0}
.namebox .fr{font:800 1.7rem/1.1 var(--font-d)}
.namebox .fr.sci{font-style:italic}
.namebox .sub{font-size:1.2rem;line-height:1.25;color:var(--muted)}
.cmp .namebox .fr{font-size:1.15rem}.cmp .namebox .sub{font-size:1rem}
.chip .x{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0 2px;min-width:24px}
.trow{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.trow input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.tname{flex:1;min-width:0;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer;min-height:44px;overflow-wrap:anywhere}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.specctl{gap:8px 12px;font-size:.82rem}
.specctl label{display:flex;align-items:center;gap:4px}
.specctl input[type=number]{width:74px;min-height:34px;padding:2px 8px}
.zbtn{align-self:flex-start}
.zoom{background:rgba(0,0,0,.94);padding:0;touch-action:none;overflow:hidden}
.zoom img{max-width:100vw;max-height:100vh;transform-origin:center;user-select:none;-webkit-user-drag:none;touch-action:none}
.zoom .zbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.7))}
.zoom .zbar .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.zoom .zbar .btn.pri{background:#fff;color:#111}
textarea.t{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:96px}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.refs{display:flex;gap:6px}.refs img{flex:1;min-width:0;height:84px;object-fit:cover;border-radius:8px}
.lvl{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lvl[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.lvl[disabled]{opacity:.5;cursor:default}
.lvl .no{font:800 1.3rem var(--font-d);width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.lvl.done .no{background:var(--ok);color:var(--accent-ink)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp .media img.photo{min-height:100px;max-height:30vh}
.cmp .spec{height:110px}
#tb i{background:var(--bad);transition:none}
.seg button{flex:1;padding:12px 4px!important;font:inherit;background:var(--surface);color:var(--ink);border:0;padding:12px;cursor:pointer;min-height:48px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font:800 1.5rem var(--font-d)}
.tile span{font-size:.82rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:.8rem}
.medal{width:72px;height:72px}.medal.off{opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(10,18,14,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay .box{background:var(--surface);border-radius:16px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;max-width:90vw;font-size:.9rem}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar>i{transition:none}}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug button{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;min-height:44px}
.sug button.sel{background:var(--accent);color:#fff}.sug button.sel .hint{color:#fff}
.sug button:last-child{border:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
svg.chart text{fill:var(--muted);font:11px var(--font-m)}
.nmslot{margin:-2px 0 2px}.nmslot:empty{display:none}.listen{align-self:center;min-height:36px;padding:4px 14px;font-size:.85rem}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
ul.refs-list{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
</style>
</head>

<script>
'use strict';
const ERRLOG = (() => { try { return JSON.parse(localStorage.getItem('fnt.errlog') || '[]'); } catch { return []; } })();
function logErr(kind, msg, extra) {
  try { ERRLOG.push({ t: new Date().toISOString(), kind, msg: String(msg).slice(0, 500), extra: String(extra || '').slice(0, 900) }); while (ERRLOG.length > 60) ERRLOG.shift(); localStorage.setItem('fnt.errlog', JSON.stringify(ERRLOG)); } catch {}
}
window.addEventListener('error', e => logErr('error', e.message, (e.filename || '') + ':' + e.lineno + ':' + e.colno + ' ' + (e.error && e.error.stack || '')));
window.addEventListener('unhandledrejection', e => logErr('promise', (e.reason && e.reason.message) || e.reason, e.reason && e.reason.stack));
const _consoleError = console.error.bind(console);
console.error = (...a) => { try { logErr('console', a.map(x => (x && x.message) || String(x)).join(' '), a[0] && a[0].stack); } catch {} _consoleError(...a); };
/* =====================================================================
   FieldNaturalistTrainer — entraînement au "jizz" à partir de GBIF
   Tout tourne côté navigateur ; la progression est stockée en localStorage.
   ===================================================================== */

/* ---------- utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const qs = o => Object.entries(o).flatMap(([k, v]) => v === undefined || v === '' ? [] : Array.isArray(v) ? v.map(x => k + '=' + encodeURIComponent(x)) : [k + '=' + encodeURIComponent(v)]).join('&');
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const x = items[i++]; await fn(x); } })); }
const median = a => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };

const mem = {};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); } catch {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- constantes ---------- */
const GBIF = 'https://api.gbif.org/v1/';
const BACKBONE = 'd7dddbf4-2cf0-4f39-9b2a-bb099caae36c';
const XC_DS = 'b1047888-ae52-4179-9dd5-5448ea342a24';
const RANKP = { species: 'speciesKey', genus: 'genusKey', family: 'familyKey' };
const UNITS = { species: ['espèce', 'espèces', 'nouvelle espèce'], genus: ['genre', 'genres', 'nouveau genre'], family: ['famille', 'familles', 'nouvelle famille'] };
const U = c => UNITS[(c && c.rank) || 'species'];
const LEVEL_DEFS = [
  { name: 'Débutant', pct: 5 }, { name: 'Facile', pct: 10 }, { name: 'Intermédiaire', pct: 25 },
  { name: 'Difficile', pct: 50 }, { name: 'Expert', pct: 100 }
];
const TIER_COLORS = ['#b07a4a', '#aab2b8', '#d4a72c', '#6ec6d8', '#9a8cf5'];
const PRESETS = [
  { key: 212, label: 'Oiseaux', sci: 'Aves', rank: 'CLASS', snd: 1 }, { key: 359, label: 'Mammifères', sci: 'Mammalia', rank: 'CLASS', snd: 1 }, { key: 734, label: 'Chauves-souris', sci: 'Chiroptera', rank: 'ORDER', snd: 1 },
  { key: 131, label: 'Amphibiens', sci: 'Amphibia', rank: 'CLASS', snd: 1 }, { key: 358, label: 'Reptiles', sci: 'Reptilia', rank: 'CLASS' }, { key: 1458, label: 'Orthoptères (sauterelles, criquets)', sci: 'Orthoptera', rank: 'ORDER', snd: 1 },
  { key: 797, label: 'Papillons (Lépidoptères)', sci: 'Lepidoptera', rank: 'ORDER' }, { key: 789, label: 'Libellules (Odonates)', sci: 'Odonata', rank: 'ORDER' }, { key: 1470, label: 'Coléoptères', sci: 'Coleoptera', rank: 'ORDER' },
  { key: 1457, label: 'Hyménoptères', sci: 'Hymenoptera', rank: 'ORDER' }, { key: 811, label: 'Diptères', sci: 'Diptera', rank: 'ORDER' }, { key: 1496, label: 'Araignées', sci: 'Araneae', rank: 'ORDER' },
  { key: 204, label: 'Poissons (Actinoptérygiens)', sci: 'Actinopterygii', rank: 'CLASS' }, { key: 7707728, label: 'Plantes vasculaires', sci: 'Tracheophyta', rank: 'PHYLUM' }, { key: 5, label: 'Champignons', sci: 'Fungi', rank: 'KINGDOM' }
];
const ROOTS = [{ key: 1, sci: 'Animalia', label: 'Animaux', rank: 'KINGDOM' }, { key: 6, sci: 'Plantae', label: 'Plantes', rank: 'KINGDOM' }, { key: 5, sci: 'Fungi', label: 'Champignons', rank: 'KINGDOM' }, { key: 4, sci: 'Chromista', label: 'Chromistes', rank: 'KINGDOM' }, { key: 7, sci: 'Protozoa', label: 'Protozoaires', rank: 'KINGDOM' }, { key: 3, sci: 'Bacteria', label: 'Bactéries', rank: 'KINGDOM' }, { key: 2, sci: 'Archaea', label: 'Archées', rank: 'KINGDOM' }];
const RANK_FR = { KINGDOM: 'règne', SUBKINGDOM: 'sous-règne', PHYLUM: 'embranchement', SUBPHYLUM: 'sous-embr.', SUPERCLASS: 'super-classe', CLASS: 'classe', SUBCLASS: 'sous-classe', INFRACLASS: 'infra-classe', SUPERORDER: 'super-ordre', ORDER: 'ordre', SUBORDER: 'sous-ordre', INFRAORDER: 'infra-ordre', PARVORDER: 'parvordre', SUPERFAMILY: 'super-famille', FAMILY: 'famille', SUBFAMILY: 'sous-famille', TRIBE: 'tribu', SUBTRIBE: 'sous-tribu', GENUS: 'genre', SUBGENUS: 'sous-genre', SECTION: 'section', SERIES: 'série', SPECIES: 'espèce', SUBSPECIES: 'sous-espèce', COHORT: 'cohorte', DIVISION: 'division', UNRANKED: 'non classé' };
const LIFE = { ADULT: 'adulte', JUVENILE: 'juvénile', IMMATURE: 'immature', LARVA: 'larve', PUPA: 'nymphe/pupe', NYMPH: 'nymphe', EGG: 'œuf', IMAGO: 'imago', SUBADULT: 'subadulte', SPORE: 'spore', SEED: 'graine', EMBRYO: 'embryon' };
const lifeFr = x => { const k = String(x || '').trim().toUpperCase().replace(/[ -]/g, '_'); return LIFE[k] || String(x || '').trim().toLowerCase(); };
const BIOMES_FR = { 1: 'Forêts tropicales et subtropicales humides', 2: 'Forêts tropicales et subtropicales sèches', 3: 'Forêts de conifères tropicales et subtropicales', 4: 'Forêts tempérées de feuillus et mixtes', 5: 'Forêts tempérées de conifères', 6: 'Forêts boréales / taïga', 7: 'Prairies, savanes et fourrés tropicaux et subtropicaux', 8: 'Prairies, savanes et fourrés tempérés', 9: 'Prairies et savanes inondées', 10: 'Prairies et fourrés de montagne', 11: 'Toundra', 12: 'Forêts, bois et maquis méditerranéens', 13: 'Déserts et fourrés xériques', 14: 'Mangroves' };
const DEFAULTS = { threshold: 90, trainShots: 4, blockSize: 10, sessionLen: 20, yearFrom: new Date().getFullYear() - 20, minRecords: 2, xcKey: '', zoneFirst: true, timeLimit: 0, testShots: 0, window: 0, coverage: 100, nameFirst: 'fr', autocomplete: true, specFmin: 0, specFmax: 0, timeExp: false, immatures: false, tts: 'off', slideSec: 3, slideRep: 2, ghRepo: '', pseudo: '', endpoint: '', share: false, autoShare: false, lastShare: 0 };
const GH_REPO = '';      // optionnel : « proprietaire/depot » fixé par le mainteneur du site
const COLLECT_URL = '';  // optionnel : URL du point de collecte (voir collecte-apps-script.gs)
let S = { ...DEFAULTS, ...LS.get('fnt.settings', {}) };
const saveSettings = () => LS.set('fnt.settings', S);
let COURSES = LS.get('fnt.courses', {});
const NAMES = LS.get('fnt.names', {});
const saveCourses = () => LS.set('fnt.courses', COURSES);
const saveNames = () => LS.set('fnt.names', NAMES);
const BAD = Object.assign({ items: {}, ds: {}, owner: {}, log: [] }, LS.get('fnt.bad', {}));
const ownerOf = it => String(it.creator || '').trim().toLowerCase();
const penalty = it => (it.ds && it.ds !== 'xeno-canto' && it.ds !== XC_DS ? BAD.ds[it.ds] || 0 : 0) + (ownerOf(it) ? BAD.owner[ownerOf(it)] || 0 : 0);
function markBad(c, k, item, why) {
  if (!item) return;
  BAD.items[item.id] = Date.now();
  if (item.ds) BAD.ds[item.ds] = (BAD.ds[item.ds] || 0) + 1;
  const o = ownerOf(item); if (o) BAD.owner[o] = (BAD.owner[o] || 0) + 1;
  BAD.log.push({ t: Date.now(), id: item.id, occ: item.occ, ds: item.ds, dsn: item.dsn, owner: o, k, why });
  if (BAD.log.length > 500) BAD.log.shift();
  LS.set('fnt.bad', BAD);
  if (c) poolOf(c, k).bad.add(item.id);
}

/* ---------- réseau ---------- */
async function jget(url, { retries = 2, timeout = 20000 } = {}) {
  for (let i = 0; ; i++) {
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), timeout);
    try {
      const r = await fetch(url, { signal: ac.signal }); clearTimeout(to);
      if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return await r.json();
    } catch (e) {
      clearTimeout(to);
      if (i >= retries || (e.status && e.status < 500 && e.status !== 429)) throw e;
      await sleep(600 * (i + 1));
    }
  }
}

function curveSVG(c) {
  const tr = firstTrials(c); if (tr.length < 5) return '<p class="hint">La courbe apparaît après 5 réponses.</p>';
  const W = 640, H = 250, m = { l: 34, r: 10, t: 14, b: 26 }, win = [], pts = [];
  tr.forEach(t => { win.push(t[3]); if (win.length > 20) win.shift(); pts.push(win.reduce((a, b) => a + b, 0) / win.length * 100); });
  const x = i => m.l + i / (tr.length - 1) * (W - m.l - m.r), y = v => m.t + (1 - v / 100) * (H - m.t - m.b);
  const line = pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const lv = levelsOf(c); let marks = '';
  tr.forEach((t, i) => { if (i && t[1] !== tr[i - 1][1]) marks += `<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${x(i) + 3}" y="${m.t + 9}">${esc((lv[t[1]] || {}).name || '')}</text>`; });
  const ticks = [0, 25, 50, 75, 100].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
  const xt = [0, Math.floor((tr.length - 1) / 2), tr.length - 1].map((i, j) => `<text x="${x(i)}" y="${H - 8}" text-anchor="${j === 0 ? 'start' : j === 2 ? 'end' : 'middle'}">${i + 1}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe d’apprentissage : précision glissante sur 20 réponses" style="width:100%;height:auto">${ticks}${marks}
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(S.threshold)}" y2="${y(S.threshold)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="${line}L${x(tr.length - 1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(tr.length - 1)}" cy="${y(pts[pts.length - 1])}" r="4.5" fill="var(--accent)"/>${xt}</svg>
    <p class="hint">Précision glissante (20 dernières réponses, hors rappels). Pointillé doré : seuil de ${S.threshold} %. Axe horizontal : numéro de réponse.</p>`;
}
function viewProgress() {

  const c = COURSES[V.id] || cs.sort((a, b) => (b.last || 0) - (a.last || 0))[0]; V.id = c.id;
  const tr = firstTrials(c), last50 = tr.slice(-50), acc = last50.length ? Math.round(last50.reduce((a, t) => a + t[3], 0) / last50.length * 100) : 0;
  const rt = median(last50.filter(t => t[3] && t[6]).map(t => t[6])) / 1000;
  const conf = {}; tr.filter(t => !t[3] && t[4]).forEach(t => { const key = t[2] + '>' + t[4]; conf[key] = (conf[key] || 0) + 1; });
  const cf = Object.entries(conf).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const byS = {}; tr.forEach(t => { (byS[t[2]] = byS[t[2]] || []).push(t[3]); });

  app.innerHTML = `<h2>Progression</h2>
  <select id="cpick" aria-label="Parcours">${cs.map(x => `<option value="${esc(x.id)}" ${x.id === c.id ? 'selected' : ''}>${esc(courseTitle(x))}</option>`).join('')}</select>
  <div class="tiles"><div class="tile"><b>${tr.length}</b><span>réponses</span></div><div class="tile"><b>${acc} %</b><span>50 dernières</span></div><div class="tile"><b>${rt ? rt.toFixed(1) + ' s' : '–'}</b><span>temps médian (bonnes réponses)</span></div><div class="tile"><b>${Object.keys(c.trained).length}/${c.species.length}</b><span>espèces étudiées</span></div></div>
  <section class="card col"><h3>Courbe d’apprentissage</h3>${curveSVG(c)}</section>
  ${weak.length ? `<section class="card col"><h3>À retravailler</h3>${weak.map(([k, a, n]) => `<div class="row sp"><span>${esc(dn(+k))}</span><span class="chip ${a < .6 ? 'bad' : ''}">${Math.round(a * 100)} % · ${n}×</span></div>`).join('')}</section>` : ''}
  ${cf.length ? `<section class="card col"><h3>Confusions fréquentes</h3>${cf.map(([key, n]) => { const [a, b] = key.split('>'); return `<div class="row sp"><span>${esc(dn(+a))} <span class="hint">pris pour</span> ${esc(dn(+b))}</span><span class="chip mono">${n}×</span></div>`; }).join('')}</section>` : ''}
  ${sess.length ? `<section class="card col"><h3>Dernières sessions</h3><div class="scroll"><table>${sess.slice(-8).reverse().map(s => `<tr><td>${new Date(s.start).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td><td class="mono">${s.n} rép.</td><td><span class="chip ${s.ok / s.n >= S.threshold / 100 ? 'ok' : ''}">${Math.round(s.ok / s.n * 100)} %</span></td></tr>`).join('')}</table></div></section>` : ''}`;
  $('#cpick').onchange = e => { V.id = e.target.value; viewProgress(); };
}

/* ---------- méthode ---------- */
function viewMethod() {
  app.innerHTML = `<h2>Méthode d’apprentissage</h2>
  <section class="card col"><h3>Pourquoi cette progression</h3>
  <p><b>Peu d’espèces d’abord, les plus communes en premier.</b> Les paliers 5, 10, 25, 50, 100 % limitent la charge initiale ; les espèces que vous rencontrerez le plus souvent sont acquises en premier, et chaque palier contient les précédents.</p>
  <p><b>Étude avec le nom, puis test sur des images neuves.</b> L’entraînement montre chaque espèce avec son nom. Le test utilise toujours des photos ou sons jamais vus, ce qui mesure la généralisation, c’est-à-dire la reconnaissance sur le terrain, et non la mémoire d’une image.</p>
  <p><b>Exemplaires variés.</b> Plusieurs observateurs, lumières et postures par espèce, puisés dans votre zone en priorité.</p>
  <p><b>Bloqué puis entrelacé.</b> Chaque espèce est d’abord vue deux fois de suite pour fixer ses traits, puis les espèces sont mélangées, ce qui oblige à les discriminer entre elles.</p>
  <p><b>Rappel actif avec correction immédiate.</b> Le test demande de produire le nom ; l’erreur déclenche la bonne réponse et des images de référence. Les espèces ratées reviennent après 3 à 6 essais avec une autre image (rappel espacé) ; ces rappels ne comptent pas dans le score.</p>
  <p><b>Comparaison de paires proches.</b> Deux espèces souvent confondues (ou du même genre) sont présentées côte à côte puis testées en choix forcé : la discrimination se construit sur ce qui les distingue.</p>
  <p><b>Temps limité (option).</b> Une limite de quelques secondes pousse vers la reconnaissance globale plutôt que l'analyse de détails.</p>
  <p><b>Fréquence de révision adaptative.</b> Les espèces peu réussies, jamais testées ou non vues depuis longtemps sont tirées plus souvent.</p>
  <p><b>Passage de niveau.</b> Au moins ${S.threshold} % de réussite (réglable) sur les N dernières réponses du palier. Par défaut N = 1,5 × nombre de labels (entre 20 et 60) et tous les labels du palier doivent être étudiés. Pour les très grands groupes, fixez N à 30 et réduisez la part de labels à étudier (mode grand groupe).</p></section>
  <section class="card col"><h3>Limites à connaître</h3>
  <p>Le classement local repose sur le nombre d’observations GBIF, donc sur l’effort d’observation autant que sur l’abondance. Les espèces très photographiées ou très suivies paraissent plus communes.</p>
  <p>Certaines photos GBIF sont imparfaites (mauvaise identification, individu partiel). Le bouton « Média inutilisable » l’écarte.</p></section>
  <section class="card col"><h3>Références</h3><ul class="refs-list">
  <li>Roediger &amp; Karpicke (2006). Test-enhanced learning. <i>Psychological Science</i>.</li>
  <li>Kornell &amp; Bjork (2008). Learning concepts and categories: is spacing the “enemy of induction”? <i>Psychological Science</i>.</li>
  <li>Carvalho &amp; Goldstone (2014). Putting category learning in order. <i>Memory &amp; Cognition</i>.</li>
  <li>Cepeda et al. (2006). Distributed practice in verbal recall tasks. <i>Psychological Bulletin</i>.</li>
  <li>Bjork (1994). Memory and metamemory considerations in the training of human beings.</li>
  <li>Goldstone (1998). Perceptual learning. <i>Annual Review of Psychology</i>.</li></ul></section>
  <section class="card col"><h3>Origine du projet</h3>
  <p>Cette application est née d'une idée de <b>Maxime Cauchoix</b> (SETE, CNRS) et a été codée par <b>Claude</b> (Anthropic), à partir de ses demandes successives.</p></section>
  <section class="card col"><h3>Coût environnemental de la création (estimation)</h3>
  <p>Le développement a nécessité <b>11 demandes</b> (12 messages, l'une ayant été envoyée deux fois) et environ <b>3 à 4 heures de calcul cumulé</b> : génération du code, appels d'outils et tests automatisés.</p>
  <h4>1. Électricité d'usage</h4>
  <p>Hypothèses : l'équivalent de 150 à 300 W de serveur (part d'un nœud GPU partagé, refroidissement compris) et 0,2 à 0,45 kg CO₂e par kWh. On obtient <b>0,5 à 1 kWh</b> et <b>0,1 à 0,45 kg CO₂e</b>.</p>
  <h4>2. Entraînement du modèle et fabrication des serveurs</h4>
  <p>Hypothèses (non publiées par Anthropic, reprises de la littérature sur les grands modèles, par ex. BLOOM) : part de l'entraînement du modèle amortie sur l'ensemble de ses usages, <b>+20 à 60 %</b> de l'énergie d'usage ; fabrication, transport, construction et maintenance des serveurs et des bâtiments (émissions « incorporées »), <b>+20 à 40 %</b>. Facteur global de <b>×1,4 à ×2,0</b>.</p>
  <p><b>Bilan carbone : environ 0,15 à 0,9 kg CO₂e</b> (valeur centrale vers 0,4 kg), soit de l'ordre de 1 à 5 km en voiture thermique.</p>
  <h4>3. Eau</h4>
  <p>Selon <a href="https://arxiv.org/abs/2304.03271" target="_blank" rel="noopener">Li et al. (2023), « Making AI Less Thirsty »</a>, la moyenne des États-Unis est de 0,55 L/kWh consommés sur site (refroidissement) et 3,14 L/kWh pour produire l'électricité, soit environ <b>4,2 L par kWh</b> ; les auteurs jugent ce chiffre prudent, la réalité pouvant être plusieurs fois supérieure. Appliqué à l'énergie d'usage, puis au même facteur ×1,4 à ×2,0 pour l'entraînement et la fabrication (l'eau de fabrication des puces n'est pas documentée précisément) : <b>environ 3 à 9 litres d'eau</b>, soit quelques bouteilles. Cette valeur dépend beaucoup du lieu et du réseau électrique, que nous ne connaissons pas.</p>
  <h4>4. Biodiversité</h4>
  <p>Il n'existe pas de mesure directe pour un usage d'IA. Le seul calcul possible passe par le climat : avec un facteur d'analyse du cycle de vie de l'ordre de 1 à 3 × 10⁻⁹ espèce·an par kg CO₂e pour les écosystèmes terrestres (famille de méthodes ReCiPe 2016 ; ordre de grandeur donné de mémoire, non revérifié ici), le bilan carbone ci-dessus correspond à environ <b>10⁻¹⁰ à 3 × 10⁻⁹ espèce·an</b>, c'est-à-dire un effet minuscule par projet, mais qui s'additionne avec le nombre d'usages. Ce calcul ne couvre <b>pas</b> l'occupation des sols par les centres de données, l'extraction des métaux, ni le stress hydrique local, qui sont les impacts les plus directs sur la biodiversité mais qu'on ne sait pas attribuer à un projet donné.</p>
  <p class="hint">Ce sont des ordres de grandeur, pas des mesures : Anthropic ne publie pas la consommation par requête, la durée de calcul est estimée à la louche, et les parts « entraînement » et « fabrication » sont des hypothèses larges. Les appareils de l'utilisateur ne sont pas comptés. L'usage de l'application elle-même ne mobilise aucun serveur : tout s'exécute dans votre navigateur, avec des requêtes vers GBIF.</p></section>
  <section class="card col"><h3>Sources de données</h3><p>Occurrences, images, sons, noms valides et noms français : <a href="https://www.gbif.org" target="_blank" rel="noopener">GBIF</a> (Backbone Taxonomy)  ; sons : GBIF et <a href="https://xeno-canto.org" target="_blank" rel="noopener">xeno-canto</a> ; biomes et écorégions : <a href="https://ecoregions.appspot.com" target="_blank" rel="noopener">RESOLVE Ecoregions 2017</a> ; contours des régions : geo.api.gouv.fr ; fonds de carte OpenTopoMap, Esri et contributeurs OpenStreetMap. Les crédits et licences de chaque média sont affichés sous l’image.</p></section>`;
}

function ghRepoGuess() {
  if (S.ghRepo) return S.ghRepo; if (GH_REPO) return GH_REPO;
  const h = location.hostname; if (/\.github\.io$/i.test(h)) { const o = h.replace(/\.github\.io$/i, ''), seg = location.pathname.split('/').filter(Boolean)[0]; return o + '/' + (seg && !/\.html?$/i.test(seg) ? seg : h); }
  return '';
}
async function ghIssue(id) {
  const repo = ($('#ghrepo') ? $('#ghrepo').value : ghRepoGuess()).trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return toast('Indiquez le dépôt GitHub sous la forme proprietaire/depot.');
  S.ghRepo = repo; saveSettings();
  const r = REPORTS.find(x => x.id === id) || REPORTS[REPORTS.length - 1]; if (!r) return toast('Enregistrez d’abord un signalement.');
  const full = JSON.stringify(r, null, 1);
  try { await navigator.clipboard.writeText(full); } catch {}
  const sn = r.snapshot || {}, kind = r.type === 'bug' ? 'Bug' : r.type === 'id' ? 'Erreur d’identification' : 'Suggestion';
  let body = `**Type** : ${kind}\n\n**Description**\n${r.text || ''}\n\n**Contexte**\n- Écran : ${sn.view || ''}\n- Parcours : ${(sn.course && sn.course.id) || ''}\n- Média : ${JSON.stringify(sn.currentTrial || sn.currentCard || r.media || '').slice(0, 700)}\n- Navigateur : ${r.ua}\n- Page : ${r.page}\n\n**Dernières erreurs techniques**\n\`\`\`\n${(r.errors || []).slice(-4).map(e => e.msg + ' ' + (e.extra || '').slice(0, 200)).join('\n')}\n\`\`\`\n\n_Journal complet copié dans le presse-papiers : collez-le ci-dessous si besoin._\n`;
  const mk = b => `https://github.com/${repo}/issues/new?title=${encodeURIComponent('[' + kind + '] ' + String(r.text || '').slice(0, 70))}&body=${encodeURIComponent(b)}&labels=${encodeURIComponent(r.type === 'bug' ? 'bug' : r.type === 'id' ? 'identification' : 'enhancement')}`;
  let url = mk(body); while (url.length > 7000 && body.length > 300) { body = body.slice(0, Math.floor(body.length * 0.8)); url = mk(body); }
  window.open(url, '_blank', 'noopener'); toast('Page GitHub ouverte. Journal complet copié : collez-le dans l’issue si utile.');
}

  badReset: () => modal(`<h3>Réinitialiser la liste ?</h3><p class="hint">Les médias écartés pourront de nouveau être proposés.</p><button class="btn danger" data-m="y">Réinitialiser</button><button class="btn ghost" data-m="n">Annuler</button>`, a => { if (a === 'y') { BAD.items = {}; BAD.ds = {}; BAD.owner = {}; BAD.log = []; LS.set('fnt.bad', BAD); viewSettings(); } }),
  setRank: t => { NEWC.rank = t.dataset.r; t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); },
  setZone: t => { const N = NEWC; N.zk = t.dataset.z; N.country = N.wkt = undefined; N.zcode = ''; N.zlabel = ''; viewNew(); },
  bigMode: () => { S.window = 30; S.coverage = 20; saveSettings(); toast('Mode grand groupe activé : 30 réponses, 20 % étudiés.'); render(); },
  forceLevel: () => modal(`<h3>Valider ce niveau sans test ?</h3><p class="hint">Vous passez au palier suivant sans badge pour celui-ci.</p><button class="btn pri" data-m="y">Valider</button><button class="btn ghost" data-m="n">Annuler</button>`, a => { if (a !== 'y') return; const c = COURSES[V.id], lv = levelsOf(c); if (c.levelIdx >= lv.length - 1) c.completed = Date.now(); else { c.maxLevel = Math.max(c.maxLevel, c.levelIdx + 1); c.levelIdx++; } save(c); viewCourse(); }),
  startCompare,
  cmpOther: async () => { CP.pi = (CP.pi + 1) % CP.pairs.length; busy('Chargement de la paire…'); try { await loadPair(); busy(false); viewCompare(); } catch { busy(false); toast('Médias indisponibles.'); } },
  cmpDrill: () => { CP.drill = { n: 0, ok: 0, total: 10, cur: null }; drillNext(); },
  cmpBack: () => viewCompare(),
  cmpNext: () => drillNext(),
  cmpQuit: () => { const id = CP.c.id; CP = null; stopSound(); go('course', { id }); },
  cmpPick: t => {
    const d = CP.drill, cur = d.cur, c = CP.c; if (!cur || cur.done) return; cur.done = true;
    const ok = +t.dataset.k === cur.k; d.n++; d.ok += ok ? 1 : 0;
    const [a, b] = CP.pairs[CP.pi], id = [a, b].sort().join('-'); c.pairs = c.pairs || {}; const p = c.pairs[id] || (c.pairs[id] = { n: 0, ok: 0 }); p.n++; p.ok += ok ? 1 : 0; p.last = Date.now(); save(c);
    document.querySelectorAll('[data-act=cmpPick]').forEach(b => { b.disabled = true; if (+b.dataset.k === cur.k) b.classList.add('pri'); });
    $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}" role="status"><b>${ok ? 'Correct' : 'Raté'}</b><div class="namebox" style="text-align:left">${nameHTML(cur.k)}</div><button class="btn pri block" data-act="cmpNext">${d.n >= d.total ? 'Terminer' : 'Suivant'}</button></div>`;
    $('#fb .btn').focus();
  },
  setMode: t => { NEWC.mode = t.dataset.m; document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === t)); updateModeHint(); },
  findSpecies, createCourse,
  setLevel: t => { const c = COURSES[V.id]; c.levelIdx = +t.dataset.i; save(c); viewCourse(); },
  startTrain: () => startTrain(false), startTest,
  startSlide: () => { if (T && T.c && V.view !== 'course') V.id = T.c.id; startTrain(true); },
  autoPause: () => { if (!T || !T.auto) return; T.paused = !T.paused; if (T.paused) { AUTO++; stopSound(); cancelSpeech(); const b = $('#autoBtn'); if (b) b.textContent = '▶ Reprendre'; } else viewTrain(); },
  say: t => { cancelSpeech(); speakNames(+t.dataset.k, 1); },
  delAsk: () => modal(`<h3>Supprimer ce parcours ?</h3><p class="hint">La progression et les badges associés seront perdus.</p><button class="btn danger" data-m="del">Supprimer</button><button class="btn ghost" data-m="no">Annuler</button>`, a => { if (a === 'del') { delete COURSES[V.id]; saveCourses(); go('home'); } }),
  trainNext: () => { T.i++; viewTrain(); },
  trainPrev: () => { if (T.i) { T.i--; viewTrain(); } },
  moreBlock: async () => { busy('Préparation du bloc…'); try { await buildChunk(T.ci + 1); busy(false); viewTrain(); } catch { busy(false); toast('Réseau indisponible.'); } },
  toTest: () => { V.id = T.c.id; startTest(); },
  play: () => curMedia && curMedia._play && curMedia._play(),
  mic: toggleMic,
  idk: () => submitAnswer([''], true),
  flag: () => { clearTimeout(X.timer); const t = X.cur; if (!t || X.answered) return; markBad(X.c, t.k, t.item, 'test'); toast('Média écarté.'); X.upcoming = null; stopSound(); showTrial(); },
  nextTrial: afterTrial,
  retryTrial: () => showTrial(),
  endTest: () => { clearTimeout(X.timer); const id = X.c.id; X = null; stopSound(); go('course', { id }); },
  export: () => { const b = new Blob([JSON.stringify({ v: 2, settings: S, courses: COURSES, names: NAMES, bad: BAD, reports: REPORTS })], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'fieldnaturalisttrainer-sauvegarde.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  resetAsk: () => modal(`<h3>Tout effacer ?</h3><p class="hint">Parcours, progression, badges et réglages seront supprimés de ce navigateur.</p><button class="btn danger" data-m="y">Tout effacer</button><button class="btn ghost" data-m="n">Annuler</button>`, a => { if (a === 'y') { COURSES = {}; saveCourses(); Object.keys(NAMES).forEach(k => delete NAMES[k]); saveNames(); S = { ...DEFAULTS }; saveSettings(); go('home'); } })
};
app.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e); });
tabs.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t) ACT[t.dataset.act](t, e); });
document.addEventListener('keydown', e => {
  if ($('.overlay') || $('.zoom')) return;
  const ae = document.activeElement, typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
  const play = () => { const b = $('.listen'); if (b) { e.preventDefault(); b.click(); } };
  if (V.view === 'test' && X) {
    if (e.key === 'Enter') {
      if (X.answered) { if (!ae || ae.id !== 'nextT') { e.preventDefault(); afterTrial(); } }
      else if (ae && ae.id !== 'answer' && !(ae.tagName === 'TEXTAREA')) { e.preventDefault(); const v = $('#answer').value, al = X.voice && X.voice[0] === v ? X.voice : [v]; submitAnswer(al); }
    } else if (e.altKey && e.code === 'KeyM') { e.preventDefault(); if ($('#micBtn') && !$('#micBtn').hidden) toggleMic(); }
    else if (e.altKey && e.code === 'KeyJ' && !X.answered) { e.preventDefault(); ACT.idk(); }
    else if (e.altKey && e.code === 'KeyI' && !X.answered) { e.preventDefault(); ACT.flag(); }
    else if (e.altKey && e.code === 'KeyL') play();
    else if (e.altKey && e.code === 'KeyZ') { const z = $('.zbtn'); if (z) { e.preventDefault(); z.click(); } }
    else if (e.code === 'Space' && !typing && !(ae && ae.tagName === 'BUTTON')) play();
    else if (e.key === 'Escape' && !typing) { e.preventDefault(); ACT.endTest(); }
  }
  if (V.view === 'train' && T) {
    if (T.auto && e.code === 'Space' && !typing) { e.preventDefault(); ACT.autoPause(); }
    else if (e.key === 'ArrowRight' && !typing) ACT.trainNext(); else if (e.key === 'ArrowLeft' && !typing) ACT.trainPrev();
    else if (e.code === 'Space' && !(ae && ae.tagName === 'BUTTON')) play();
    else if (e.altKey && e.code === 'KeyL') play();
    else if (e.altKey && e.code === 'KeyI') { e.preventDefault(); ACT.trainBad(); }
    else if (e.altKey && e.code === 'KeyZ') { const z = $('.zbtn'); if (z) { e.preventDefault(); z.click(); } }
  }
});
render();
</script>
</body>
</html>
